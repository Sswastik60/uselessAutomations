[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation_hub"
version = "1.0.0"
description = "Windows 11 Automation Hub - Personal Desktop Automation & Mode Controller"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Developer" }
]
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "pydantic>=2.5.0",
    "pywin32>=306",
    "comtypes>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
automation-hub = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
