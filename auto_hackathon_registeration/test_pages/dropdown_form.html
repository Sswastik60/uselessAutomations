<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown & Academic Registration Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f11; color: #f0f0f0; margin: 0; padding: 40px; }
    .form-container { max-width: 600px; margin: 0 auto; background: #1a1a1f; padding: 32px; border-radius: 8px; border: 1px solid #2e2e38; }
    h1 { margin-top: 0; font-size: 24px; color: #fff; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #d0d0d5; }
    select, input[type="text"] {
      width: 100%; padding: 12px 14px; border: 1px solid #3a3a46; border-radius: 6px; background: #121216; color: #fff; font-size: 14px; box-sizing: border-box;
    }
    select:focus, input:focus { border-color: #707080; outline: none; }
    .radio-group { display: flex; gap: 20px; margin-top: 8px; }
    .radio-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    button[type="submit"] {
      background: #ffffff; color: #000000; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Academic Details - Hackathon 2026</h1>
    <form id="academic-form" onsubmit="event.preventDefault(); alert('Registered!');">
      <div class="form-group">
        <label for="degree_select">Degree Program *</label>
        <select id="degree_select" name="degree" required>
          <option value="">Select your degree</option>
          <option value="B.Tech">B.Tech / B.E.</option>
          <option value="B.Sc">B.Sc Computer Science</option>
          <option value="BCA">Bachelor of Computer Applications (BCA)</option>
          <option value="M.Tech">M.Tech / M.E.</option>
          <option value="MCA">Master of Computer Applications (MCA)</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="branch_select">Branch / Field of Study *</label>
        <select id="branch_select" name="branch" required>
          <option value="">Choose branch</option>
          <option value="Computer Science and Engineering">Computer Science and Engineering</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Electronics and Communication">Electronics and Communication</option>
          <option value="Electrical Engineering">Electrical Engineering</option>
          <option value="Mechanical Engineering">Mechanical Engineering</option>
        </select>
      </div>

      <div class="form-group">
        <label for="study_year">Current Year of Study *</label>
        <select id="study_year" name="year" required>
          <option value="">Select year</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>

      <div class="form-group">
        <label for="country_field">Country</label>
        <select id="country_field" name="country">
          <option value="">Select Country</option>
          <option value="India">India</option>
          <option value="United States">United States</option>
          <option value="Canada">Canada</option>
          <option value="United Kingdom">United Kingdom</option>
          <option value="Germany">Germany</option>
        </select>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="gender" value="Male"> Male</label>
          <label class="radio-item"><input type="radio" name="gender" value="Female"> Female</label>
          <label class="radio-item"><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>

      <button type="submit" id="submit-academic">Submit Registration</button>
    </form>
  </div>
</body>
</html>
