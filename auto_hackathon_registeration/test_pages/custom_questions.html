<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Hackathon Questions</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f11; color: #f0f0f0; margin: 0; padding: 40px; }
    .form-container { max-width: 600px; margin: 0 auto; background: #1a1a1f; padding: 32px; border-radius: 8px; border: 1px solid #2e2e38; }
    h1 { margin-top: 0; font-size: 24px; color: #fff; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #d0d0d5; }
    input[type="text"], textarea {
      width: 100%; padding: 12px 14px; border: 1px solid #3a3a46; border-radius: 6px; background: #121216; color: #fff; font-size: 14px; box-sizing: border-box;
    }
    textarea { height: 100px; resize: vertical; }
    button[type="submit"] {
      background: #ffffff; color: #000000; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Hackathon Essay & Custom Questions</h1>
    <form id="custom-form" onsubmit="event.preventDefault(); alert('Saved!');">
      <div class="form-group">
        <label for="why_participate_input">Why do you want to participate in this hackathon? *</label>
        <textarea id="why_participate_input" name="why_participate" placeholder="Tell us your motivation and what you hope to learn..." required></textarea>
      </div>

      <div class="form-group">
        <label for="project_idea_input">Briefly describe your proposed project idea or track:</label>
        <textarea id="project_idea_input" name="project_idea" placeholder="Share your initial thoughts or problem statement..."></textarea>
      </div>

      <div class="form-group">
        <label for="hackathon_exp">Prior hackathon experience (Yes/No):</label>
        <input type="text" id="hackathon_exp" name="hackathon_experience" placeholder="Yes / No">
      </div>

      <div class="form-group">
        <label for="custom_secret_question">What is your favorite dev tool or editor? (Unrecognized custom question)</label>
        <input type="text" id="custom_secret_question" name="fav_tool" placeholder="e.g. VS Code, Neovim, etc.">
      </div>

      <button type="submit" id="submit-custom">Submit Answers</button>
    </form>
  </div>
</body>
</html>
