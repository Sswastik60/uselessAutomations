<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Hackathon Registration Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f11; color: #f0f0f0; margin: 0; padding: 40px; }
    .form-container { max-width: 600px; margin: 0 auto; background: #1a1a1f; padding: 32px; border-radius: 8px; border: 1px solid #2e2e38; }
    h1 { margin-top: 0; font-size: 24px; color: #fff; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #d0d0d5; }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%; padding: 12px 14px; border: 1px solid #3a3a46; border-radius: 6px; background: #121216; color: #fff; font-size: 14px; box-sizing: border-box;
    }
    input:focus { border-color: #707080; outline: none; }
    button[type="submit"] {
      background: #ffffff; color: #000000; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px;
    }
    .submitted-banner { display: none; margin-top: 20px; padding: 16px; background: #223322; border: 1px solid #446644; color: #aaffaa; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>HackStart 2026 - Basic Registration</h1>
    <p style="color: #999; font-size: 14px; margin-bottom: 24px;">Please fill in your details to register for the hackathon.</p>
    
    <form id="registration-form" onsubmit="event.preventDefault(); document.getElementById('submitted-banner').style.display='block';">
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label for="emailAddress">Email Address *</label>
        <input type="email" id="emailAddress" name="emailAddress" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="phoneNumber">Mobile / Contact Number *</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="9876543210" required>
      </div>

      <div class="form-group">
        <label for="institution">College / University Name *</label>
        <input type="text" id="institution" name="institution" placeholder="University or Institute" required>
      </div>

      <button type="submit" id="submit-btn">Submit Registration</button>
      <div id="submitted-banner" class="submitted-banner">Form successfully submitted!</div>
    </form>
  </div>
</body>
</html>
